# Experiment: CIFAR-10 — prune, train, evaluate robustness.
# Keys use argparse dest names; any key a given script doesn't use is ignored.
# Pass with: python <script>.py --config configs/cifar10.yaml   (CLI args override).

dataset: cifar10

# --- pruning (main.py) ---
models: [resnet20, resnet18, vgg19]
pruners: [snip, grasp, synflow, dpai, yopo]
sparsity: [0.5, 0.9, 0.95]
dpai_steps: 100
grasp_samples_per_class: 10
yopo_search_steps: 30
output_dir: ./output

# --- training (train.py); `model` selects a single architecture ---
model: resnet20
epochs: 200
lr: 0.1
momentum: 0.9
weight_decay: 0.0005
amp: "auto"            # "auto" | "on" | "off"  (quote: YAML reads bare on/off as bool)
logger: tensorboard    # tensorboard | wandb | none
log_dir: ./runs

# --- attacks / metrics (attacks.py, metrics.py) ---
# eps/alpha are left to code defaults (8/255, 2/255) for exact values.
pgd_steps: [10, 20, 100]
aa_version: standard
n_samples: 1000

# --- shared ---
batch_size: 128
num_workers: 2
data_root: ./data
seed: 1
deterministic: false
