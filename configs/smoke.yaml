# Fast smoke config: tiny sweep to verify the pipeline end-to-end on CPU.
# python main.py  --config configs/smoke.yaml
# python train.py --config configs/smoke.yaml --checkpoint output/cifar10/resnet20_snip_s0_9.pth
# python metrics.py --config configs/smoke.yaml --checkpoint <...> --no-autoattack

dataset: cifar10

# pruning
models: [resnet20]
pruners: [snip, synflow]
sparsity: [0.9]
dpai_steps: 8
yopo_search_steps: 8
grasp_samples_per_class: 5
output_dir: ./output

# training
model: resnet20
epochs: 2
lr: 0.1
amp: "off"       # quoted: YAML treats bare off/on as booleans
logger: "none"

# attacks / metrics
pgd_steps: [10]
n_samples: 128

# shared
batch_size: 128
num_workers: 0
data_root: ./data
seed: 1
